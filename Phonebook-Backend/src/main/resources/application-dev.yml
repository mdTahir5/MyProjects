# Local development overrides.
# NOTE: nothing here should be deployed to production.
logging:
  level:
    root: INFO
    com.phonebook: DEBUG
    org.springframework.security: DEBUG

spring:
  jpa:
    show-sql: false
  flyway:
    # Dev/test only: adds db/seed/V2__seed_demo_data.sql on top of the schema,
    # creating the demo account documented in the README
    # (demo@phonebook.local / Password@123). The `prod` profile deliberately
    # omits this location, so production never gets those credentials.
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoint:
    health:
      show-details: always
