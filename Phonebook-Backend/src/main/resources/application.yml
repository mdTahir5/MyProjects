# =====================================================================
# Phonebook backend configuration
# Every sensitive / environment specific value is externalized.
# Copy .env.example -> your environment (or export the variables) before
# running. Defaults are provided ONLY for local development convenience.
# =====================================================================
server:
  # Render (and most PaaS hosts) inject PORT and forward traffic to it, so it
  # takes precedence over the local SERVER_PORT knob. Nesting the placeholders
  # keeps both working. The app binds 0.0.0.0 (Spring Boot's default), which is
  # what Render's load balancer needs.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  # Restricts what the container sends/handles (Tomcat hardening)
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
  # HTTP security headers are additionally set in SecurityConfig
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict

spring:
  application:
    name: phonebook-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ----------------------------- MySQL ------------------------------
  datasource:
    # The DB_NAME default MUST stay in sync with scripts/setup-mysql.sql and
    # backend/.env (both create/grant `phonebook_db`). Spring Boot does not read
    # .env automatically, so a wrong default here only surfaces once the app is
    # started without scripts/set-env.ps1, as:
    #   Access denied for user 'phonebook_user'@'localhost' to database '...'

    # Every part of the JDBC URL is a placeholder resolved from the environment,
    # so one file serves a local MySQL and a managed one (Render -> Aiven for
    # MySQL). Nothing here is ever a real credential.
    #   sslMode                   PREFERRED here, REQUIRED in the prod profile
    #   createDatabaseIfNotExist  true here, false in the prod profile
    #   allowPublicKeyRetrieval   needed for MySQL 8 caching_sha2_password when
    #                             the connection itself is not encrypted
    # The two profile-dependent defaults live in the `phonebook` namespace at the
    # bottom of this file. See RENDER-DEPLOYMENT.md.

    url: jdbc:mysql://${DB_HOST:mysql-phonebook-01-imperialtslearn-1cbd.g.aivencloud.com}:${DB_PORT:11173}/${DB_NAME:defaultdb}?sslMode=${phonebook.datasource.ssl-mode}&createDatabaseIfNotExist=${phonebook.datasource.create-if-not-exist}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:AVNS_LVyRfkDtTYChsqi7wxB}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: phonebook-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  # --------------------------- JPA/Hibernate --------------------------
  jpa:
    open-in-view: false
    hibernate:
      # IMPORTANT: schema is owned by Flyway. Hibernate NEVER touches DDL.
      ddl-auto: validate
    properties:
      hibernate:
        # NOTE: no explicit dialect. Hibernate detects it from the JDBC
        # connection, so the same configuration works for MySQL (dev/prod) and
        # H2 (tests) - and setting it by hand just triggers HHH90000025.
        format_sql: false
        use_sql_comments: false
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ----------------------------- Flyway ------------------------------
  # Schema only. The demo account and its contacts live in db/seed, which is
  # added to the location list by the `dev` profile alone - so a production
  # database never receives the publicly known demo credentials.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  # --------------------------- OAuth2 --------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          # Google ID tokens (used by the optional "Sign in with Google" flow)
          issuer-uri: ${OAUTH2_ISSUER_URI:https://accounts.google.com}

  # ------------------------ Multipart / misc -------------------------
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    # MUST stay false. When ProblemDetails is enabled, Spring's built-in
    # advice (ordered ahead of application advice) answers framework-level
    # exceptions - request-body validation, malformed JSON, 405/415/404 - with
    # an RFC 7807 body ({"title", "detail"}), which replaces the project's
    # uniform ApiErrorResponse ({"message", "fieldErrors", "traceId"}).
    # The SPA parses the latter, so enabling this silently drops field-level
    # validation messages. GlobalExceptionHandler covers these cases instead.
    problemdetails:
      enabled: false

# ---------------------------------------------------------------------
# JDBC URL parameters - placeholder-only namespace.
# No bean binds to it: the values above are read straight out of the
# Environment, which is how the prod profile raises both defaults without
# the JDBC URL having to be repeated in every profile file.
# ---------------------------------------------------------------------
phonebook:
  datasource:
    # PREFERRED encrypts whenever the server offers TLS and still connects to a
    # plain local MySQL. A managed database must be REQUIRED (prod profile).
    ssl-mode: ${DB_SSL_MODE:PREFERRED}
    # Handy locally: the database is created on first connect. In production the
    # database is provisioned once by you, so the app user needs no such right.
    create-if-not-exist: ${DB_CREATE_IF_NOT_EXIST:true}

# --------------------------- Application ----------------------------
app:
  # IMPORTANT: replace this secret in every real environment. It must be
  # at least 32 bytes for HS256. Generate with: openssl rand -base64 48
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-0123456789abcdef}
      # Access token lifetime in minutes
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
      issuer: ${JWT_ISSUER:phonebook-backend}
      audience: ${JWT_AUDIENCE:phonebook-app}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    oauth2:
      # Optional Google OAuth2 sign-in. Leave client-id empty to disable.
      enabled: ${OAUTH2_ENABLED:false}
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
    rate-limit:
      # Global per-IP bucket
      global-capacity: ${RATE_LIMIT_GLOBAL_CAPACITY:300}
      global-refill-minutes: ${RATE_LIMIT_GLOBAL_REFILL_MINUTES:1}
      # Sensitive endpoints (login/register)
      auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      auth-refill-minutes: ${RATE_LIMIT_AUTH_REFILL_MINUTES:1}
  admin:
    # Purges expired/revoked token rows periodically.
    # Spring cron syntax: second minute hour day-of-month month day-of-week.
    # The default runs the cleanup daily at 03:00.
    token-cleanup-cron: "${TOKEN_CLEANUP_CRON:0 0 3 * * *}"

# ------------------------------ Actuator ----------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

# ------------------------------ Logging -----------------------------
logging:
  level:
    root: INFO
    com.phonebook: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/phonebook-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
