# Test profile: runs against H2 in MySQL compatibility mode so the suite needs
# no external database. Flyway is disabled because the migrations use MySQL
# specific DDL; Hibernate creates the schema from the entities instead.
spring:
  datasource:
    url: jdbc:h2:mem:phonebook_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  admin:
    # Daily at 03:00. Spring cron syntax has six fields:
    # second minute hour day-of-month month day-of-week.
    token-cleanup-cron: "0 0 3 * * *"
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-0123456789
      access-token-ttl-minutes: 30
    rate-limit:
      global-capacity: 10000
      auth-capacity: 1000

logging:
  level:
    root: WARN
    com.phonebook: INFO
